name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package (with dev extras)
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Install built wheel and smoke-test the CLI
        run: |
          pip install dist/*.whl
          evades-search --version
          evades-search --help
