[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evades-search"
version = "0.1.0"
description = "Run the EVADES anti-defence protein database's HMM and structural searches locally, offline, from the command line."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Khalimat Murtazalieva" }]
keywords = ["bioinformatics", "anti-defence", "phage", "hmmer", "foldseek", "structural-biology"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
evades-search = "evades_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evades_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
